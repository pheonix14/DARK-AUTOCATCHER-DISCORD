<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT DARK v3.0.0 — Pokédex History</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common/style.css">
</head>
<body>

    <!-- PAGE LOADER -->
    <div id="loader">
        <div class="loader-logo">PROJECT DARK</div>
        <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
    </div>

    <!-- CURSOR -->
    <div id="cursor"></div><div id="cursor-ring"></div>

    <!-- BACKGROUNDS -->
    <div id="bg-wrap"><img id="bg-img" src="" alt="" class="fade-in"></div>
    <div class="bg-grain"></div>
    <div class="bg-color-bleed" id="colorBleed"></div>
    <div class="vignette"></div>

    <!-- WATERMARK -->
    <div id="wm">PROJECT DARK</div>

    <!-- NOTIFICATION TOAST -->
    <div id="notif-toast">
        <button class="notif-close" onclick="closeToast()">✕</button>
        <div class="notif-title" id="nt-title">SYSTEM</div>
        <div class="notif-body" id="nt-body"></div>
    </div>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- SCROLL COUNTER -->
    <div class="scroll-counter"><span id="scrollPct">00</span>%</div>

    <!-- ═══ HISTORY SECTION ═══ -->
    <section id="hero">
        <p class="hero-eyebrow">◈ Database — Caught</p>
        <h1 class="hero-h1">POKÉDEX<br><em>HISTORY</em></h1>
        
        <div style="margin-top:40px; display:flex; gap:16px;">
            <input type="text" id="searchPokemon" placeholder="Search Pokémon..." style="flex:1;">
            <select id="filterPokemon" style="flex:0.3;">
                <option value="all">All Logs</option>
                <option value="success">Successful Catches</option>
                <option value="failed">Failed / Fled</option>
            </select>
        </div>

        <div class="cards" id="catchesGallery">
            <!-- Populated by common.js -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-top">
            <div class="footer-logo">PROJECT DARK</div>
            <ul class="footer-links">
                <li><a href="/pages/index.html">◈ Home</a></li>
                <li><a href="/pages/settings.html">⬡ Settings</a></li>
                <li><a href="/pages/premium.html">◉ Premium</a></li>
                <li><a href="/pages/about.html">◎ About</a></li>
            </ul>
        </div>
        <div class="footer-bottom">
            <p class="footer-copy">© 2025 PROJECT DARK — dev by pheonix14 (v3.0.0)</p>
            <p class="footer-copy" id="bgCredit">Background: Engine Base</p>
        </div>
    </footer>

    <!-- Sidebar Menu Placeholder -->
    <div id="sidebar-placeholder"></div>

    <script src="/common/common.js"></script>
    <script src="/common/navigationbar.js"></script>
    <script src="/common/menue.js"></script>
</body>
</html>
